name: Mule CI-CD Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  build-test-publish-deploy:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout source
      # ---------------------------------------------------------
      - name: Checkout Source
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Setup Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ---------------------------------------------------------
      # 3. Configure Maven authentication for Exchange
      # ---------------------------------------------------------
      - name: Configure Maven Authentication
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

        run: |

          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="
                      http://maven.apache.org/SETTINGS/1.2.0
                      https://maven.apache.org/xsd/settings-1.2.0.xsd">

            <servers>

              <server>

                <id>anypoint-exchange-v3</id>

                <username>~~~Client~~~</username>

                <password>${env.ANYPOINT_CLIENT_ID}~?~${env.ANYPOINT_CLIENT_SECRET}</password>

              </server>

            </servers>

          </settings>
          EOF


      - name: Verify Maven Configuration
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
    
        run: |
          echo "Checking Maven settings file..."
          test -f ~/.m2/settings.xml
          echo "settings.xml exists"
      
          echo
          echo "Exchange server configuration:"
          grep -A4 -B1 "anypoint-exchange-v3" ~/.m2/settings.xml
      
          echo
          echo "Client ID length:"
          echo -n "$ANYPOINT_CLIENT_ID" | wc -c
      
          echo
          echo "Client Secret length:"
          echo -n "$ANYPOINT_CLIENT_SECRET" | wc -c
      
            # ---------------------------------------------------------
            # 4. Publish Mule Application to Anypoint Exchange
            #
            # IMPORTANT:
            # Do NOT use -DmuleDeploy here.
            # ---------------------------------------------------------
            - name: Publish to Anypoint Exchange
              run: |
                mvn -B -ntp clean deploy


      # ---------------------------------------------------------
      # 5. Deploy the already-published application
      #    to CloudHub 2.0
      # ---------------------------------------------------------
      - name: Deploy to CloudHub 2.0
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          TARGET: ${{ secrets.TARGET }}
          APP_NAME: ${{ secrets.APP_NAME }}

        run: |

          mvn -B -ntp mule:deploy \
            -DconnectedAppClientId="$ANYPOINT_CLIENT_ID" \
            -DconnectedAppClientSecret="$ANYPOINT_CLIENT_SECRET" \
            -Denvironment="$ENVIRONMENT" \
            -Dtarget="$TARGET" \
            -Dapp.name="$APP_NAME"
